<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampadina</title>
    <style>
        body
        {
            background: #001F3F;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
        .lampadina
        {
            position: relative;
        }
        .head
        {
            width: 120px;
            height: 120px;
            background: gray;
            border-radius: 190px 90px 190px 190px;
            transform: rotate(135deg);
        }
        .boh
        {
            width: 40px;
            background: gray;
            height: 40px;
            position: absolute;
            left: 41px;
            border-radius: 10px;
            top: 120px;
        }
        .ultima
        {
            width: 30px;
            height: 35px;
            background: rgb(74, 74, 74);
            position: absolute;
            top: 150px;
            left: 46px;
            z-index: -1;
            border-radius: 10px;
        }
        .res1
        {
            width: 2px;
            height: 100px;
            background: rgb(183, 181, 181);
            transform: rotate(-15deg);
            position: absolute;
            left: 43px;
            top: 62px;
            z-index: 2;
            transition: 0.5s;
        }
        .b
        {
            transform: rotate(15deg);
            left: 77px;
        }
        .res2
        {
            width: 31px;
            height: 1px;
            background: rgb(183, 181, 181);
            position: absolute;
            transform: rotate(8deg);
            left: 32px;
            top: 66px;
            z-index: 2;
            transition: 0.5s;

        }
        .d
        {
            transform: rotate(-8deg);
            left: calc(32px + 31px);
        }
        .riflesso
        {
            width: 20px;
            height: 50px;
            background: rgb(183, 181, 181);
            border-radius: 50%;
            position: absolute;
            top: 15px;
            rotate: 30deg;
            left: 20px;
        }
        .circle
        {
            width: 50px;
            height: 70px;
            background: gray;
            border-radius: 50%;
            z-index: 1;
            position: absolute;
            top: 19px;
            left: 22px;
            rotate: 12deg;
        }
        .lampadina
        {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="lampadina">
        <div class="head" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="boh" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="ultima"></div>
        <div class="riflesso" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="circle" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="res1 a" id="a" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="res1 b" id="b" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="res2 c" id="c" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
        <div class="res2 d" id="d" onmouseover="change('a', 'b', 'c', 'd')" onmouseleave="change2('a', 'b', 'c', 'd')"></div>
    </div>
    <script>
        function change(a, b, c, d)
        {
            document.getElementById(a).style.background = "#FFC0CB"; 
            document.getElementById(b).style.background = "#FFC0CB"; 
            document.getElementById(c).style.background = "#FFC0CB"; 
            document.getElementById(d).style.background = "#FFC0CB";
            document.getElementById(a).style.boxShadow = "0px -15px 60px 3px rgba(255, 192, 203, 1),0 -15px 70px 6px rgba(255, 192, 203, 1),0 -15px 80px 12px rgba(255, 192, 203, 1)"
            document.getElementById(b).style.boxShadow = "0px -15px 60px 3px rgba(255, 192, 203, 1),0 -15px 70px 6px rgba(255, 192, 203, 1),0 -15px 80px 12px rgba(255, 192, 203, 1)" 
            document.getElementById(c).style.boxShadow = "0px -15px 60px 3px rgba(255, 192, 203, 1),0 -15px 70px 6px rgba(255, 192, 203, 1),0 -15px 80px 12px rgba(255, 192, 203, 1)" 
            document.getElementById(d).style.boxShadow = "0px -15px 60px 3px rgba(255, 192, 203, 1),0 -15px 70px 6px rgba(255, 192, 203, 1),0 -15px 80px 12px rgba(255, 192, 203, 1)" 

        }
        function change2(a, b, c, d)
        {
            document.getElementById(a).style.background = "rgb(183, 181, 181)"; 
            document.getElementById(b).style.background = "rgb(183, 181, 181)"; 
            document.getElementById(c).style.background = "rgb(183, 181, 181)"; 
            document.getElementById(d).style.background = "rgb(183, 181, 181)";
            document.getElementById(a).style.boxShadow = "0px 0px 0px"
            document.getElementById(b).style.boxShadow = "0px 0px 0px" 
            document.getElementById(c).style.boxShadow = "0px 0px 0px" 
            document.getElementById(d).style.boxShadow = "0px 0px 0px" 

        }
    </script>
</body>

</html>
